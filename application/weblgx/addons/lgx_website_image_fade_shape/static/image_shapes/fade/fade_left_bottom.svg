<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="600">
  <!-- Fondu progressif depuis la gauche et le bas. -->
  <defs>
    <radialGradient id="fadeGrad" gradientUnits="objectBoundingBox" cx="1" cy="0" r="1.15">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#777777"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <path id="filterPath" d="M0,0 H1 V1 H0 Z"/>
    <mask id="fadeMask" maskUnits="objectBoundingBox" maskContentUnits="objectBoundingBox">
      <rect width="1" height="1" fill="url(#fadeGrad)"/>
    </mask>
  </defs>
  <svg viewBox="0 0 1 1" id="preview" preserveAspectRatio="none">
    <rect width="1" height="1" fill="url(#fadeGrad)"/>
  </svg>
  <image xlink:href="" width="100%" height="100%" preserveAspectRatio="none" mask="url(#fadeMask)"/>
</svg>
